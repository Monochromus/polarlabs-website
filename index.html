<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Polar Labs entwickelt KI-gestützte Tools: mapMind für intelligente Kartenvisualisierung und Pocket Assistant – dein persönlicher KI-Produktivitäts-Agent. Made in Germany." />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="de" />
    <link rel="canonical" href="https://polarlabs.de/" />

    <!-- hreflang Tags für Internationalisierung -->
    <link rel="alternate" hreflang="de" href="https://polarlabs.de/" />
    <link rel="alternate" hreflang="en" href="https://polarlabs.de/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://polarlabs.de/" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://polarlabs.de/" />
    <meta property="og:title" content="Polar Labs – KI-Werkzeuge für Produktivität & Kartenvisualisierung" />
    <meta property="og:description" content="Entdecke mapMind für KI-gestützte Karten und Pocket Assistant – dein Second Brain für den Alltag. Deutsche AI-Tools." />
    <meta property="og:image" content="https://polarlabs.de/logo_large.png" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:site_name" content="Polar Labs" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://polarlabs.de/" />
    <meta name="twitter:title" content="Polar Labs – KI-Werkzeuge für Produktivität & Kartenvisualisierung" />
    <meta name="twitter:description" content="Entdecke mapMind für KI-gestützte Karten und Pocket Assistant – dein Second Brain für den Alltag. Deutsche AI-Tools." />
    <meta name="twitter:image" content="https://polarlabs.de/logo_large.png" />

    <!-- JSON-LD Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Polar Labs",
      "alternateName": "PolarLabs",
      "url": "https://polarlabs.de",
      "logo": {
        "@type": "ImageObject",
        "url": "https://polarlabs.de/logo_large.png",
        "width": 512,
        "height": 512
      },
      "description": "KI-gestützte Tools für Produktivität und Kartenvisualisierung. Made in Germany.",
      "foundingDate": "2024",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Kiel",
        "addressCountry": "DE"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "url": "https://polarlabs.de/contact",
        "availableLanguage": ["German", "English"]
      },
      "knowsAbout": ["Künstliche Intelligenz", "Produktivitäts-Software", "Kartenvisualisierung", "AI Tools"]
    }
    </script>

    <!-- JSON-LD Structured Data: WebSite with SearchAction -->
    <script id="page-schema" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Polar Labs",
      "url": "https://polarlabs.de",
      "inLanguage": ["de", "en"],
      "publisher": {
        "@type": "Organization",
        "name": "Polar Labs"
      }
    }
    </script>

    <!-- JSON-LD Structured Data: BreadcrumbList (dynamisch pro Seite) -->
    <script id="breadcrumb-schema" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://polarlabs.de/"
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Polar Labs – KI-Werkzeuge für Produktivität & Kartenvisualisierung</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
