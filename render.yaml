services:
  - type: web
    name: polarlabs-website
    runtime: static
    buildCommand: npm install && npm run build:prerender
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600, s-maxage=86400
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.html
        name: Cache-Control
        value: public, max-age=300, s-maxage=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
